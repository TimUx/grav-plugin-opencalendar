  FRONTEND_DAY: Day
  FRONTEND_LIST: List
  FRONTEND_AGENDA: Agenda
  FRONTEND_ALL_DAY: All day
  FRONTEND_LOCATION: Location
  FRONTEND_SOURCE: Source
  FRONTEND_READ_MORE: Read more
  FRONTEND_RESULTS: '%1 events found'
  FRONTEND_PAGE: 'Page %1 of %2'
  FRONTEND_PAGINATION: Event pagination
  FRONTEND_CLOSE: Close
  FRONTEND_DATE: Date
  FRONTEND_TIME: Time
  FRONTEND_ORGANIZER: Organizer
  FRONTEND_CATEGORIES: Categories
  FRONTEND_ATTACHMENTS: Attachments
  FRONTEND_ATTACHMENT: Attachment
  FRONTEND_DESCRIPTION: Description
  FRONTEND_URL: Website
  FRONTEND_SUBSCRIBE: Subscribe to calendar
  FRONTEND_SUBSCRIBE_COPY: Copy ICS URL
