  FRONTEND_SUBSCRIBE_COPIED: Copied

  # Errors
  ERROR_SYNC_FAILED: 'Synchronization failed for source "%s".'
  ERROR_SOURCE_DISABLED: 'Source "%s" is disabled.'
  ERROR_SOURCE_NOT_FOUND: 'Calendar source not found.'
  ERROR_INVALID_URL: 'Invalid source URL or path.'
  ERROR_HTTP: 'HTTP error while fetching calendar data.'
  ERROR_PARSE: 'Failed to parse calendar data.'
